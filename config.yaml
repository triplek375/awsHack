# Job data collection pipeline configuration.
# Everything tunable lives here; no values are hardcoded in source.

search:
  keywords:          # each keyword runs as its own HiringCafe search
    - data engineer
    - cloud engineer
  locations:         # free-text locations sent in the HiringCafe searchState
    - Texas
    - remote US
  date_fetched_past_n_days: 61
  max_pages_per_run: 10

http:
  user_agent: "job-data-pipeline/1.0 (+contact@example.com)"
  delay_seconds: 1.5          # polite delay between requests
  timeout_seconds: 30
  retry:
    max_attempts: 5
    backoff_base_seconds: 1.0  # exponential backoff: base * 2**attempt
    retry_on_status: [429, 500, 502, 503, 504]

sources:
  hiring_cafe:
    enabled: true
    search_url: "https://hiring.cafe/api/search-jobs"
    count_url: "https://hiring.cafe/api/search-jobs/get-total-count"
    page_size: 100
    # Default searchState filters. Query / locations / date window are injected
    # per-run from the `search` section above; these are the remaining filters.
    search_state_defaults:
      workplaceTypes: ["Remote", "Hybrid", "Onsite"]
      defaultToUserLocation: false
      commitmentTypes:
        ["Full Time", "Part Time", "Contract", "Internship", "Temporary"]
      seniorityLevel:
        ["No Prior Experience Required", "Entry Level", "Mid Level", "Senior Level"]
      roleTypes: ["Individual Contributor", "People Manager"]
      sortBy: "default"
      companyPublicOrPrivate: "all"
      isNonProfit: "all"

  # Optional ATS sources. Disabled by default; add company slugs to enable.
  greenhouse:
    enabled: true
    url_template: "https://boards-api.greenhouse.io/v1/boards/{company}/jobs?content=true"
    companies: ["stripe", "databricks", "airbnb"]   # real public Greenhouse boards

  lever:
    enabled: false
    url_template: "https://api.lever.co/v0/postings/{company}?mode=json"
    companies: []     # e.g. ["netflix", "plaid"]

  ashby:
    enabled: false
    url_template: "https://api.ashbyhq.com/posting-api/job-board/{company}"
    companies: []     # e.g. ["ramp", "linear"]

# Resume skill profile. Jobs are scored by how many of these skills appear in
# the title + description, weighted, then normalized to 0-100. Jobs below
# min_score are dropped; the rest are written to the CSV sorted highest-first.
resume:
  min_score: 25.0       # 0-100; raise for a tighter shortlist
  default_weight: 1.0   # weight for any skill not listed in `weights`
  skills:
    # Analytics / data
    - SQL
    - Python
    - Excel
    - Tableau
    - Data Analysis
    - Data Visualization
    - ETL
    # Cloud & data platforms
    - AWS
    - Amazon Redshift
    - AWS EMR
    - AWS Athena
    - Amazon S3
    - Azure Stack HCI
    - Red Hat OpenStack
    # Infrastructure & tools
    - Kubernetes
    - Docker
    - Linux
    - VMware
    - Apache Airflow
    - Git
    # Business & product
    - Requirements Gathering
    - Customer Onboarding
    - Feature Validation
    - Stakeholder Management
    - Process Improvement
    - Root Cause Analysis
    - Agile
    - Scrum
  # Technical skills weighted higher so a real tech match outranks buzzwords.
  weights:
    Python: 3.0
    SQL: 3.0
    Apache Airflow: 3.0
    AWS: 2.5
    ETL: 2.5
    Kubernetes: 2.0
    Docker: 2.0
    Tableau: 2.0
    Amazon Redshift: 2.0
    AWS EMR: 2.0
    AWS Athena: 2.0
    Amazon S3: 2.0
    Data Analysis: 1.5
    Data Visualization: 1.5
    Linux: 1.5
    VMware: 1.5
    Git: 1.0
    # Business terms kept at low weight (they match loosely in many postings).
    Requirements Gathering: 0.5
    Customer Onboarding: 0.5
    Feature Validation: 0.5
    Stakeholder Management: 0.5
    Process Improvement: 0.5
    Root Cause Analysis: 0.5
    Agile: 0.5
    Scrum: 0.5

storage:
  mode: "local"        # "local" | "s3"
  local_dir: "./data"
  jsonl_prefix: "jobs" # -> jobs/dt=YYYY-MM-DD/run.jsonl
  csv_name: "jobs_latest.csv"
  s3:
    bucket: ""
    prefix: ""

offline: false         # true => read from samples/ instead of the network
